spring.application.name=parqueadero

# Base de datos H2 en memoria: no requiere instalar nada para correr local
spring.datasource.url=jdbc:h2:mem:parqueadero;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql se ejecuta despues de que Hibernate crea las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10

# Consola web de H2, util para inspeccionar los datos en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Render asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# JWT: clave con la que se firman los tokens y cuanto duran (1 hora)
# En produccion la clave llega en la variable JWT_SECRET; en local se usa la de respaldo
jwt.secret=${JWT_SECRET:una-clave-secreta-larga-para-firmar-los-tokens-jwt-del-parqueadero-2026}
jwt.expiration-ms=3600000
